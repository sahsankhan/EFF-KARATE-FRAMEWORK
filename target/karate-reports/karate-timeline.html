      <script>
(function() {
    function reorderFeatures() {
        try {
            console.log('Starting feature reordering...');
            
            // Reorder main features table
            const mainTable = document.querySelector('.features-table tbody');
            if (mainTable) {
                console.log('Reordering main features table');
                reorderTable(mainTable);
            }
            
            // Reorder tags table if it exists (try multiple selectors)
            const tagSelectors = ['.table-condensed tbody', '.table tbody', '#tags .table tbody', '[role="tabpanel"] .table tbody'];
            let tagsTable = null;
            for (const selector of tagSelectors) {
                tagsTable = document.querySelector(selector);
                if (tagsTable && tagsTable.closest('#tags, [aria-labelledby="tags-tab"]')) {
                    console.log('Found tags table with selector:', selector);
                    break;
                }
            }
            if (tagsTable) {
                console.log('Reordering tags table');
                reorderTable(tagsTable);
            } else {
                console.log('Tags table not found - trying alternative approach');
                setTimeout(() => reorderTagsTableAlternative(), 500);
            }
            
            // Also set up observers for tab switching
            setupTabObserver();
            
        } catch (e) {
            console.error('Error in reorderFeatures:', e);
        }
    }
    
    function reorderTable(table) {
        try {
            
            const order = ['Features/auth/checkUsername.feature','Features/auth/signup.feature','Features/auth/setpassword.feature','Features/auth/verifyEmail.feature','Features/auth/login.feature','Features/auth/forgotPassword.feature','Features/auth/verifyResetCode.feature','Features/auth/validateToken.feature','Features/auth/refreshToken.feature','Features/user-management/getUser.feature','Features/user-management/updateUser.feature','Features/eff-data/blitzLeagues/checkBlitzLeagueName.feature','Features/eff-data/exchangeLeagues/checkExchangeLeagueName.feature','helpers/setTimeframeToPreSeason.feature','Features/eff-data/leagues/getHomePagePublicExtremeLeagues.feature','Features/eff-data/leagues/getAvailableLeagues.feature','Features/eff-data/blitzLeagues/joinPublicBlitzLeague.feature','Features/eff-data/blitzTeams/createBlitzTeam.feature','Features/eff-data/blitzTeams/checkBlitzTeamName.feature','Features/eff-data/blitzTeams/getBlitzTeam.feature','Features/eff-data/blitzTeams/getBlitzTeams.feature','Features/eff-data/blitzTeams/getBlitzTeamsByLeague.feature','Features/eff-data/blitzLeagues/getBlitzLeague.feature','Features/eff-data/blitzLeagues/leavePublicBlitzLeague.feature','Features/eff-data/blitzLeagues/createBlitzLeague.feature','helpers/createSecondUser.feature','Features/eff-data/blitzLeagues/joinPrivateBlitzLeague.feature','Features/eff-data/blitzTeams/createBlitzTeamPrivateLeague.feature','Features/eff-data/blitzTeams/getBlitzTeamPrivateLeague.feature','Features/eff-data/blitzTeams/getBlitzTeamsPrivateLeague.feature','Features/eff-data/blitzTeams/getBlitzTeamsByPrivateLeague.feature','Features/eff-data/blitzLeagues/getPrivateBlitzLeague.feature','Features/eff-data/blitzLeagues/leavePrivateBlitzLeague.feature','Features/eff-data/exchangeLeagues/joinPublicExchangeLeague.feature','Features/eff-data/exchangeTeams/createExchangeTeam.feature','Features/eff-data/exchangeTeams/checkExchangeTeamName.feature','Features/eff-data/exchangeTeams/getExchangeTeam.feature','Features/eff-data/exchangeTeams/getExchangeTeams.feature','Features/eff-data/exchangeTeams/getExchangeTeamsByLeague.feature','Features/eff-data/exchangeLeagues/getExchangeLeague.feature','Features/eff-data/exchangeLeagues/leavePublicExchangeLeague.feature','Features/eff-data/exchangeLeagues/createExchangeLeague.feature','Features/eff-data/exchangeLeagues/joinPrivateExchangeLeague.feature','Features/eff-data/exchangeTeams/createExchangeTeamPrivateLeague.feature','Features/eff-data/exchangeTeams/getExchangeTeamPrivateLeague.feature','Features/eff-data/exchangeTeams/getExchangeTeamsPrivateLeague.feature','Features/eff-data/exchangeTeams/getExchangeTeamsByPrivateLeague.feature','Features/eff-data/exchangeLeagues/getPrivateExchangeLeague.feature','Features/eff-data/exchangeLeagues/leavePrivateExchangeLeague.feature','Features/user-management/deleteUserAccountByEmail.feature'];
            
            const rows = Array.from(table.querySelectorAll('tr'));
            console.log('Found', rows.length, 'rows in table');
            
            const featureMap = {};
            rows.forEach(row => {
                const cell = row.querySelector('td');
                if (cell) {
                    const featureName = cell.textContent.trim();
                    featureMap[featureName] = row;
                }
            });
            
            table.innerHTML = '';
            
            let reorderedCount = 0;
            order.forEach(feature => {
                if (featureMap[feature]) {
                    table.appendChild(featureMap[feature]);
                    delete featureMap[feature];
                    reorderedCount++;
                }
            });
            
            // Add any remaining features
            Object.values(featureMap).forEach(row => table.appendChild(row));
            
            console.log('Reordered', reorderedCount, 'features in this table');
        } catch (e) {
            console.error('Error reordering table:', e);
        }
    }
    
    function reorderTagsTableAlternative() {
        try {
            console.log('Trying alternative tags table detection...');
            // Look for any table that might be the tags table
            const allTables = document.querySelectorAll('table tbody');
            for (const table of allTables) {
                const firstRow = table.querySelector('tr');
                if (firstRow) {
                    const firstCell = firstRow.querySelector('td');
                    if (firstCell && firstCell.textContent.includes('.feature')) {
                        console.log('Found potential tags table, attempting reorder...');
                        reorderTable(table);
                        table.setAttribute('data-reordered', 'true');
                        break;
                    }
                }
            }
        } catch (e) {
            console.error('Error in alternative tags table reordering:', e);
        }
    }
    
    function setupTabObserver() {
        try {
            // Watch for tab clicks with better timing
            const tabs = document.querySelectorAll('a[href="#tags"], a[href="#summary"], [data-toggle="tab"]');
            tabs.forEach(tab => {
                tab.addEventListener('click', (event) => {
                    const isTagsTab = tab.getAttribute('href') === '#tags' || tab.textContent.toLowerCase().includes('tags');
                    const delay = isTagsTab ? 500 : 200; // Extra delay for tags tab
                    setTimeout(() => {
                        console.log('Tab switched to:', isTagsTab ? 'tags' : 'other', 'reordering tables...');
                        reorderFeatures();
                        if (isTagsTab) {
                            // Extra attempt for tags
                            setTimeout(() => reorderTagsTableAlternative(), 300);
                        }
                    }, delay);
                });
            });
            
            // Also use MutationObserver to catch dynamic table changes
            const observer = new MutationObserver((mutations) => {
                // Check for tags tables with multiple selectors
                const tagSelectors = ['.table-condensed tbody', '.table tbody', '#tags .table tbody', '[role="tabpanel"] .table tbody'];
                for (const selector of tagSelectors) {
                    const tagsTable = document.querySelector(selector);
                    if (tagsTable && !tagsTable.hasAttribute('data-reordered')) {
                        // Check if this is actually a tags table by looking for .feature files
                        const firstRow = tagsTable.querySelector('tr td');
                        if (firstRow && firstRow.textContent.includes('.feature')) {
                            setTimeout(() => {
                                console.log('New tags table detected with selector:', selector);
                                reorderTable(tagsTable);
                                tagsTable.setAttribute('data-reordered', 'true');
                            }, 100);
                            break;
                        }
                    }
                }
            });
            
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
            
        } catch (e) {
            console.error('Error setting up tab observer:', e);
        }
    }
    
    function addScenarioBoxes() {
        try {
            const table = document.querySelector('.features-table tbody');
            if (!table) return;
            
            let totalPassedScenarios = 0;
            let totalFailedScenarios = 0;
            
            const rows = table.querySelectorAll('tr');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                if (cells.length >= 5) {
                    totalPassedScenarios += parseInt(cells[2].textContent.trim()) || 0;
                    totalFailedScenarios += parseInt(cells[3].textContent.trim()) || 0;
                }
            });
            
            const navCount = document.querySelector('.nav-count');
            const existingPass = document.getElementById('nav-pass');
            const existingFail = document.getElementById('nav-fail');
            
            if (navCount && existingPass && existingFail && !document.getElementById('scenarios-added')) {
                
                // Add spacing to existing feature boxes
                existingPass.style.marginBottom = '2px';
                existingFail.style.marginBottom = '2px';
                
                // Add Features label AFTER feature boxes (in middle)
                const featuresLabel = document.createElement('div');
                featuresLabel.textContent = 'Features';
                featuresLabel.style.cssText = 'font-size: 11px; color: #999; text-align: center; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; margin: 10px 0 15px 0;';
                navCount.appendChild(featuresLabel);
                
                // Create scenario boxes with identical styling
                const passedBox = document.createElement('div');
                passedBox.className = existingPass.className;
                
                // Copy all attributes
                for (let i = 0; i < existingPass.attributes.length; i++) {
                    const attr = existingPass.attributes[i];
                    if (attr.name !== 'id') {
                        passedBox.setAttribute(attr.name, attr.value);
                    }
                }
                
                // Copy exact styling
                const passedStyles = window.getComputedStyle(existingPass);
                passedBox.style.height = passedStyles.height;
                passedBox.style.minHeight = passedStyles.minHeight;
                passedBox.style.padding = passedStyles.padding;
                passedBox.style.fontSize = passedStyles.fontSize;
                passedBox.style.fontWeight = passedStyles.fontWeight;
                passedBox.style.fontFamily = passedStyles.fontFamily;
                passedBox.style.lineHeight = passedStyles.lineHeight;
                passedBox.style.textAlign = passedStyles.textAlign;
                passedBox.style.display = passedStyles.display;
                passedBox.style.alignItems = passedStyles.alignItems;
                passedBox.style.justifyContent = passedStyles.justifyContent;
                passedBox.style.boxSizing = passedStyles.boxSizing;
                passedBox.style.marginBottom = '2px';
                
                passedBox.textContent = totalPassedScenarios;
                
                // Same for failed box
                const failedBox = document.createElement('div');
                failedBox.className = existingFail.className;
                
                for (let i = 0; i < existingFail.attributes.length; i++) {
                    const attr = existingFail.attributes[i];
                    if (attr.name !== 'id') {
                        failedBox.setAttribute(attr.name, attr.value);
                    }
                }
                
                const failedStyles = window.getComputedStyle(existingFail);
                failedBox.style.height = failedStyles.height;
                failedBox.style.minHeight = failedStyles.minHeight;
                failedBox.style.padding = failedStyles.padding;
                failedBox.style.fontSize = failedStyles.fontSize;
                failedBox.style.fontWeight = failedStyles.fontWeight;
                failedBox.style.fontFamily = failedStyles.fontFamily;
                failedBox.style.lineHeight = failedStyles.lineHeight;
                failedBox.style.textAlign = failedStyles.textAlign;
                failedBox.style.display = failedStyles.display;
                failedBox.style.alignItems = failedStyles.alignItems;
                failedBox.style.justifyContent = failedStyles.justifyContent;
                failedBox.style.boxSizing = failedStyles.boxSizing;
                
                failedBox.textContent = totalFailedScenarios;
                
                // Add scenario boxes
                navCount.appendChild(passedBox);
                navCount.appendChild(failedBox);
                
                // Add Scenarios label at the very bottom
                const scenariosLabel = document.createElement('div');
                scenariosLabel.textContent = 'Scenarios';
                scenariosLabel.style.cssText = 'font-size: 11px; color: #999; text-align: center; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; margin: 10px 0 0 0;';
                navCount.appendChild(scenariosLabel);
                
                // Mark as done
                const marker = document.createElement('div');
                marker.id = 'scenarios-added';
                marker.style.display = 'none';
                document.body.appendChild(marker);
                
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }
    
    function enhance() {
        // Add a small delay to ensure table is fully rendered
        setTimeout(() => {
            reorderFeatures();
            addScenarioBoxes();
            
            // Recheck periodically for dynamically loaded content
            setTimeout(() => {
                console.log('Performing periodic check for tables...');
                reorderFeatures();
                reorderTagsTableAlternative();
            }, 1000);
            
            // Additional periodic check specifically for tags
            setInterval(() => {
                const allTables = document.querySelectorAll('table tbody');
                let foundUnorderedTagsTable = false;
                for (const table of allTables) {
                    if (!table.hasAttribute('data-reordered')) {
                        const firstCell = table.querySelector('tr td');
                        if (firstCell && firstCell.textContent.includes('.feature')) {
                            console.log('Periodic check found unordered tags table');
                            reorderTable(table);
                            table.setAttribute('data-reordered', 'true');
                            foundUnorderedTagsTable = true;
                        }
                    }
                }
            }, 3000);
        }, 100);
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', enhance);
    } else {
        enhance();
    }
})();
