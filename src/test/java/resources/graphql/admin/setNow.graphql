mutation SetNow($now_utc: AWSDateTime!) {
  setNow(now_utc: $now_utc) {
    statusCode
    message
    current_timeframe {
      Season
      SeasonType
      Week
      CurrentDateTime_UTC
      StartDate
      WeekStart_UTC
      WeekStarted
      FirstGameStart_UTC
      FirstGameStarted
      LastGameStart_UTC
      LastGameStarted
      LastGameEnd_UTC
      LastGameEnded
      SeasonPhase
      LastCompletedWeek
      UpcomingWeek
      Notes
    }
  }
}
