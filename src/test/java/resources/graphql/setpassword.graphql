mutation SetPassword(
  $email: String!,
  $resetKey: String!,
  $password: String!,
  $test_bypass: Boolean
) {
  setPassword(
    email: $email,
    resetKey: $resetKey,
    password: $password,
    test_bypass: $test_bypass
  ) {
    ... on SetPasswordResponse {
      message
      email
      statusCode
    }
    ... on ErrorResponse {
      message
      statusCode
    }
  }
}
