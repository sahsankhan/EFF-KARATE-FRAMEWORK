mutation SignUp(
  $nickname: String,
  $email: String,
  $address: AddressInput,
  $dob: String,
  $phone: String,
  $favorite_teams: [String],
  $heard_about_us: String
  ) {
  signUp(
    nickname: $nickname,
    email: $email,
    address: $address,
    dob: $dob,
    phone: $phone,
    favorite_teams: $favorite_teams,
    heard_about_us: $heard_about_us
    ) {
    statusCode
    message
    email
    temporarySignupKey
  }
}
