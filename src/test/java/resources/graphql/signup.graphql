mutation SignUp(
  $first_name: String,
  $last_name: String,
  $email: String,
  $address: AddressInput,
  $dob: String,
  $phone: String,
  $favorite_teams: [String],
  $heard_about_us: String
) {
  signUp(
    first_name: $first_name,
    last_name: $last_name,
    email: $email,
    address: $address,
    dob: $dob,
    phone: $phone,
    favorite_teams: $favorite_teams,
    heard_about_us: $heard_about_us
  ) {
    statusCode
    message
    email
    temporarySignupKey
  }
}
