query GetExchangeTeam($Team_ID: ID!) {
  getExchangeTeam(Team_ID: $Team_ID) {
    statusCode
    teams {
      _id
      Team_Name
      Team_Image
      League_ID
      Owner_Email
      Owner_ID
      Cash
      Assets_Value
      Rank
      Total_Value
      Total_Transactions
      Transaction_Limit
      Weekly_Value
      Weekly_Transactions
      owner {
        id
        username
        profile_picture
      }
      league_details {
        League_Name
        Game_Type
        League_Type
        Public
        Members
      }
      sys_dateCreated
      sys_dateModified
      sys_deleted
      sys_userCreated_id
      sys_userCreatedName
      sys_userModified_id
      sys_userModifiedName
    }
  }
}