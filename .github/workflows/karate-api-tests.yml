name: Karate API Automation

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Dev

jobs:
  karate-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build Project
        run: mvn clean install -DskipTests

      - name: Run Karate Tests
        run: mvn test

      - name: Generate Automation Summary
        if: always()
        run: |
          echo "## 📊 Automation Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
          # ===== FEATURE COUNT =====
          PASSED_FEATURES=$(grep -o 'class="passed"' target/karate-reports/karate-summary.html | wc -l)
          FAILED_FEATURES=$(grep -o 'class="failed"' target/karate-reports/karate-summary.html | wc -l)
          TOTAL_FEATURES=$((PASSED_FEATURES + FAILED_FEATURES))
      
          echo "### 📁 Feature File Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Total Features Executed: $TOTAL_FEATURES" >> $GITHUB_STEP_SUMMARY
          echo "- Passed Features: $PASSED_FEATURES" >> $GITHUB_STEP_SUMMARY
          echo "- Failed Features: $FAILED_FEATURES" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
          # ===== SCENARIO COUNT =====
          TOTAL_SCENARIOS=$(grep -o '"scenarioCount":[0-9]*' target/karate-reports/karate-summary-json.txt | cut -d: -f2 | paste -sd+ | bc)
          FAILED_SCENARIOS=$(grep -o '"failedCount":[0-9]*' target/karate-reports/karate-summary-json.txt | cut -d: -f2 | paste -sd+ | bc)
          PASSED_SCENARIOS=$((TOTAL_SCENARIOS - FAILED_SCENARIOS))
      
          echo "### 🧪 Scenario Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Total Scenarios Executed: $TOTAL_SCENARIOS" >> $GITHUB_STEP_SUMMARY
          echo "- Passed Scenarios: $PASSED_SCENARIOS" >> $GITHUB_STEP_SUMMARY
          echo "- Failed Scenarios: $FAILED_SCENARIOS" >> $GITHUB_STEP_SUMMARY
      
        

      - name: Upload Karate HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports-${{ github.run_number }}
          path: target/karate-reports/
          retention-days: 7

      - name: Publish Test Results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'target/karate-reports/*.xml'
          include_passed: true
          detailed_summary: true
          fail_on_failure: false

      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Surge
        if: always()
        run: npm install -g surge

      - name: Deploy Report to Surge.sh
        if: always()
        run: |
          SURGE_DOMAIN="karate-report-${{ github.run_number }}-${{ github.run_id }}.surge.sh"
          surge ./target/karate-reports $SURGE_DOMAIN --token ${{ secrets.SURGE_TOKEN || 'anonymous' }}
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 View Full HTML Report" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Click here to open report in browser](https://$SURGE_DOMAIN/karate-summary.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [Alternative view: Timeline Report](https://$SURGE_DOMAIN/karate-timeline.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Report will be available for 30 days" >> $GITHUB_STEP_SUMMARY